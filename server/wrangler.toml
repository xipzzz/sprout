name = "sprout-scan"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Switch the vision provider with this one variable: openai, anthropic, or xai.
# mock is rejected by the Worker.
# MODEL overrides the adapter. OpenAI defaults to gpt-6-astra (the measured model).
# Anthropic and xAI refuse to start until MODEL is set.
# COST_PER_SCAN_USD is required: the price of BOTH calls for one page, copied
# from the provider's current price page. There is no default.
[vars]
PROVIDER = "openai"
ALLOWED_ORIGIN = "https://xipzzz.github.io"
DAILY_SCAN_LIMIT = "20"
BURST_PER_MINUTE = "5"
MONTHLY_SPEND_CAP_USD = "5"
# MODEL = "gpt-6-astra"
# COST_PER_SCAN_USD = ""

# REQUIRED before deploy. `node check-config.mjs` (and wrangler) refuse to start
# while this id is still a placeholder.
#   npx wrangler kv namespace create SCAN_LIMITS
[[kv_namespaces]]
binding = "SCAN_LIMITS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[build]
command = "node check-config.mjs"

# Secrets (not in this file):
#   npx wrangler secret put VISION_API_KEY
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put ALLOWED_EMAILS
#   npx wrangler secret put COST_PER_SCAN_USD
# Optional secret or var: MODEL
