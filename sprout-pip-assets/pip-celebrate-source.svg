<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Pip celebrating">
  <!-- Stem tall into leaf cluster -->
  <rect x="37.5" y="12" width="5" height="34" rx="2.5" fill="#3f7a2e" />
  <!-- Leaves overlap stem centerline (x=40); arms-up -->
  <ellipse cx="33" cy="13" rx="16" ry="9.5" fill="#6FBF5E" transform="rotate(-36 40 18)" />
  <ellipse cx="47" cy="13" rx="16" ry="9.5" fill="#4D9E3F" transform="rotate(36 40 18)" />
  <!-- Junction seal so left leaf cannot float -->
  <circle cx="40" cy="18" r="3.2" fill="#3f7a2e" />
  <circle cx="40" cy="53" r="18" fill="#6FBF5E" />
  <circle cx="40" cy="53" r="18" fill="#ffffff" opacity="0.06" />
  <circle cx="34" cy="49.5" r="2.7" fill="#2f3b24" />
  <circle cx="46" cy="49.5" r="2.7" fill="#2f3b24" />
  <!-- Happier Correct grin -->
  <path d="M29.5 52.5 q10.5 15.5 21 0" stroke="#2f3b24" stroke-width="3" fill="none" stroke-linecap="round" />
  <circle cx="28.5" cy="56" r="2.6" fill="#ffffff" opacity="0.28" />
  <circle cx="51.5" cy="56" r="2.6" fill="#ffffff" opacity="0.28" />
</svg>
